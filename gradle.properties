# Gradle 守护进程 JVM 参数（wondertool 与 aiops-copilot 保持同一份内容）。
# 守护进程的工作目录是项目根目录，JVM 崩溃日志默认写工作目录，
# 会把 hs_err_pid*.log / replay_pid*.log 撒进源码目录；统一指到 logs/（相对路径基于项目根）。
# logs/ 目录随仓库存在（.gitkeep），JVM 不会自建目录，目录缺失时会退回工作目录。
# 注意：设置本属性会整体覆盖 Gradle 默认 daemon 参数；不写 -Xmx，堆上限用 JVM 默认（物理内存的 1/4）。
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -XX:ErrorFile=logs/hs_err_pid%p.log
