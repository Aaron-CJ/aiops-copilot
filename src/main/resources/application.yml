server:
  port: 8080

# AIOps Agent 自定义配置
aiops:
  security:
    # API 访问令牌：非空时 /api/** 全部需要鉴权（Authorization: Bearer <token>
    # 或 X-API-Key 头；SSE 接口可用 ?token= 传参）；留空则不鉴权（本地开发默认）。
    # 生产通过环境变量注入：AIOPS_API_TOKEN=你的强随机令牌
    token: ${AIOPS_API_TOKEN:}
  prometheus:
    # Prometheus HTTP API 地址，供 PrometheusTool 调用 /api/v1/query
    # Agent 把这里当"时序数据的眼睛"——不通过 Grafana 看图，直接读 API
    # Docker 部署时改为宿主机/独立机：PROMETHEUS_BASE_URL=http://host.docker.internal:9090
    base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  models:
    # 快速通道模型：定时巡检 + 交互 Agent（关闭思考链，追求低延迟）
    # 深度推理/RAG 模型直接复用下方 spring.ai.ollama.chat.model（deepseek-r1:8b）
    fast: qwen3:8b
  diagnosis:
    # 深度诊断任务队列（DiagnosisService，白皮书 4.2），均可用环境变量覆盖
    queue-capacity: ${AIOPS_DIAGNOSIS_QUEUE_CAPACITY:20}          # 有界队列容量，满则拒绝并记审计
    dedup-window-minutes: ${AIOPS_DIAGNOSIS_DEDUP_WINDOW_MINUTES:10}   # 同一指纹自动升级的最小间隔
    worker-timeout-minutes: ${AIOPS_DIAGNOSIS_WORKER_TIMEOUT_MINUTES:15} # r1 单次推理硬超时（实测最长 8.8 分钟）
    max-finished-tasks: ${AIOPS_DIAGNOSIS_MAX_FINISHED_TASKS:100} # 终态任务内存保留条数

spring:
  application:
    name: aiops-copilot
  # 未显式指定时默认 dev 环境（DebugController 等故障注入夹具仅 dev 装配）；
  # 生产通过环境变量切换：SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 启用 JDK 21 虚拟线程：Tomcat 每个请求改由轻量虚拟线程处理，
  # 等待 LLM 生成这类长时间阻塞 IO 时不再占满平台线程池
  threads:
    virtual:
      enabled: true
  ai:
    # Spring AI 2.0 允许同时引入多种模型实现（ollama/openai/...），
    # 此处显式指定 chat 与 embedding 分别激活哪一种实现
    model:
      chat: ollama
      embedding: ollama
    ollama:
      # Ollama 后台服务地址
      # Docker 部署时改为宿主机/独立机：OLLAMA_BASE_URL=http://host.docker.internal:11434
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # 启动时不自动 pull 缺失的模型，由开发者手动 ollama pull，
        # 避免应用启动时因静默下载大模型而长时间卡住
        pull-model-strategy: never
      chat:
        # 对话模型：deepseek-r1:8b（带 thinking 能力的推理模型）
        model: deepseek-r1:8b
      embedding:
        # 向量化模型：bge-m3，输出 1024 维，中文语义检索能力强于 nomic-embed-text
        model: bge-m3
    vectorstore:
      milvus:
        client:
          # Milvus standalone（Docker）的 gRPC 地址与默认凭据
          # Docker 部署时改为宿主机/独立机：MILVUS_HOST=host.docker.internal
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          # 生产凭据通过环境变量注入：MILVUS_PASSWORD=你的强密码
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:milvus}
        # Milvus 的 database（类似关系库的"库"），下方的 collection 类似"表"
        database-name: default
        # 存放知识片段的 collection 名，含向量与文本字段
        collection-name: aiops_knowledge
        # 必须与 Ollama embedding 模型维度保持一致（bge-m3 = 1024），
        # 不一致会导致写入/检索时报维度不匹配
        embedding-dimension: 1024
        # 向量索引类型：IVF_FLAT 先按聚类中心粗筛、再对候选向量精确计算余弦，
        # 是中小规模数据的常用取舍——查询快、内存省；聚类数/nprobe 会影响召回率（当前用默认值）
        index-type: IVF_FLAT
        # 相似度度量方式：COSINE 余弦相似度，语义检索场景最常用
        metric-type: COSINE
        # 启动时自动创建 Collection（含向量字段与索引），已存在则跳过
        initialize-schema: true

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        # 默认只暴露 health，这里显式放行 prometheus（指标抓取）与 info
        # 不建议 include: *，env/beans/threaddump 等端点会泄露敏感信息
        include: health,info,prometheus
  metrics:
    tags:
      # 给所有指标打上应用名标签，可在 Prometheus 中按 application 维度聚合查询
      application: ${spring.application.name}
