server:
  port: 8080

# AIOps Agent 自定义配置
aiops:
  security:
    # API 访问令牌：非空时 /api/** 全部需要鉴权（Authorization: Bearer <token>
    # 或 X-API-Key 头；SSE 接口可用 ?token= 传参）；留空则不鉴权（本地开发默认，
    # 启动时打 WARN 提示）。生产通过环境变量注入：AIOPS_API_TOKEN=你的强随机令牌
    token: ${AIOPS_API_TOKEN:}
  debug:
    # 故障注入调试接口（/api/debug/**）总开关，默认关。dev profile + 本开关同时满足才装配——
    # 默认 profile 是 dev（SPRING_PROFILES_ACTIVE 缺省 dev），单靠 profile 防不住
    # "忘设环境变量"的部署意外暴露 OOM/死锁/CPU 注入端点。评估演练时显式打开：
    # AIOPS_DEBUG_ENABLED=true
    enabled: ${AIOPS_DEBUG_ENABLED:false}
  prometheus:
    # Prometheus HTTP API 地址，供 PrometheusTool 调用 /api/v1/query
    # Agent 把这里当"时序数据的眼睛"——不通过 Grafana 看图，直接读 API
    # Docker 部署时改为宿主机/独立机：PROMETHEUS_BASE_URL=http://host.docker.internal:9090
    base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
    # 被动模式（/api/agent/ops 模型自主查询）的短 TTL 缓存：对齐 Prometheus 15s 抓取间隔，
    # TTL 内同一 PromQL 不重复打 Prometheus（模型单轮常并发 5-6 次查询）；设 0s 可关闭
    query-cache-ttl: ${AIOPS_PROM_QUERY_CACHE_TTL:15s}
  ollama:
    # Ollama REST（.call() 同步推理）读超时：默认 16m = 深度诊断 15min 硬超时 + 1min 余量——
    # 合法推理不被截断，但 Ollama 僵死时每个卡死调用 16 分钟后必然终结、线程得以释放
    #（此前读超时无限，future.cancel 断不了底层 HTTP，每轮超时泄漏 1 个挂死线程）
    rest-read-timeout: ${AIOPS_OLLAMA_REST_READ_TIMEOUT:16m}
  models:
    # 快速通道模型：定时巡检 + 交互 Agent（关闭思考链，追求低延迟）
    # 深度推理/RAG 模型直接复用下方 spring.ai.ollama.chat.model（deepseek-r1:8b）
    fast: qwen3:8b
  targets:
    # 多目标监控：巡检对列表内每个目标并行采集并逐一判定，
    # 自己（application = spring.application.name）永远自动在列、不可删除。
    # 缺省 list 为空 = 只监控自己（行为与单目标版一致）。
    # 纳管其它应用：目标应用需自行配置 management.metrics.tags.application=<标签值>
    # （Spring Boot 一行配置）；非 JVM 目标通过 metrics 覆盖映射接入（配什么 PromQL
    # 得什么值，留空的语义记 -1 哨兵被 AI 忽略），语言无关。
    # list:
    #   - name: 订单服务
    #     application: order-service
    #     # JVM/Spring 目标可整体省略 metrics（用默认档）；其它语言在这里配"语义 → PromQL"映射，
    #     # 留空的语义记 -1 哨兵被 AI 忽略；qpsLast1m 配了单查询即跳过内置的 Java 侧减法
    #     metrics:
    #       qpsLast1m: 'sum(rate(http_requests_total{app="pay"}[1m]))'
  inspection:
    # 巡检 LLM 调用超时（秒）。默认 45 = 单目标（60s 周期的 75%）；
    # 多目标部署 Prompt 与输出都更长，实测 2 目标 + 机器负载下 45s 不够（llm_timeout 连发），
    # 建议按目标数上调至 90-150（fixedDelay 语义下轮次自动拉长，不会堆积）
    llm-timeout-seconds: ${AIOPS_INSPECTION_LLM_TIMEOUT_SECONDS:45}
  diagnosis:
    # 深度诊断任务队列（DiagnosisService，白皮书 4.2），均可用环境变量覆盖
    queue-capacity: ${AIOPS_DIAGNOSIS_QUEUE_CAPACITY:20}          # 有界队列容量，满则拒绝并记审计；其中 1/4（至少 1 槽）为自动升级预留，手动提交在空闲槽位不足时先被限流
    dedup-window-minutes: ${AIOPS_DIAGNOSIS_DEDUP_WINDOW_MINUTES:10}   # 同一指纹自动升级的最小间隔
    worker-timeout-minutes: ${AIOPS_DIAGNOSIS_WORKER_TIMEOUT_MINUTES:15} # r1 单次推理硬超时（长思考链纯 CPU 推理可超 15 分钟，超时按设计收敛为 FAILED）
    max-finished-tasks: ${AIOPS_DIAGNOSIS_MAX_FINISHED_TASKS:100} # 终态任务内存保留条数

spring:
  application:
    name: aiops-copilot
  # 未显式指定时默认 dev 环境（DebugController 等故障注入夹具仅 dev 装配）；
  # 生产通过环境变量切换：SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 启用 JDK 21 虚拟线程：Tomcat 每个请求改由轻量虚拟线程处理，
  # 等待 LLM 生成这类长时间阻塞 IO 时不再占满平台线程池
  threads:
    virtual:
      enabled: true
  ai:
    # Spring AI 2.0 允许同时引入多种模型实现（ollama/openai/...），
    # 此处显式指定 chat 与 embedding 分别激活哪一种实现
    model:
      chat: ollama
      embedding: ollama
    # 收紧 Spring AI 框架级重试（2026-11-13 调整）。
    # 默认值 max-attempts=10 + backoff 倍率 5 + 上限 180s ⇒ 单次失败调用最多重试约 19 分钟，
    # 而本项目自研了超时（巡检 45s / 深度诊断 15min）、阈值降级、推理让路三层防线——
    # 框架重试会绕开这三层：巡检超时只中断"等待"，底层虚拟线程继续重试打 Ollama，
    # 每分钟新增一个 ⇒ Ollama 挂 1 小时后 60 个僵尸重试线程同时在打，
    # 恢复瞬间被淹没（NUM_PARALLEL=1 时更致命）。
    # 取 2 = 允许一次快速重试（覆盖瞬时网络抖动），退避压到秒级，不产生重试风暴。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    ollama:
      # Ollama 后台服务地址
      # Docker 部署时改为宿主机/独立机：OLLAMA_BASE_URL=http://host.docker.internal:11434
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # 启动时不自动 pull 缺失的模型，由开发者手动 ollama pull，
        # 避免应用启动时因静默下载大模型而长时间卡住
        pull-model-strategy: never
      chat:
        # 对话模型：deepseek-r1:8b（带 thinking 能力的推理模型）
        model: deepseek-r1:8b
      embedding:
        # 向量化模型：bge-m3，输出 1024 维，中文语义检索能力强于 nomic-embed-text
        model: bge-m3
    vectorstore:
      milvus:
        client:
          # Milvus standalone（Docker）的 gRPC 地址与默认凭据
          # Docker 部署时改为宿主机/独立机：MILVUS_HOST=host.docker.internal
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          # 生产凭据通过环境变量注入：MILVUS_PASSWORD=你的强密码
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:milvus}
        # Milvus 的 database（类似关系库的"库"），下方的 collection 类似"表"
        database-name: default
        # 存放知识片段的 collection 名，含向量与文本字段
        collection-name: aiops_knowledge
        # 必须与 Ollama embedding 模型维度保持一致（bge-m3 = 1024），
        # 不一致会导致写入/检索时报维度不匹配
        embedding-dimension: 1024
        # 向量索引类型：IVF_FLAT 先按聚类中心粗筛、再对候选向量精确计算余弦，
        # 是中小规模数据的常用取舍——查询快、内存省；聚类数/nprobe 会影响召回率（当前用默认值）
        index-type: IVF_FLAT
        # 相似度度量方式：COSINE 余弦相似度，语义检索场景最常用
        metric-type: COSINE
        # 启动时自动创建 Collection（含向量字段与索引），已存在则跳过
        initialize-schema: true

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        # 默认只暴露 health，这里显式放行 prometheus（指标抓取）与 info
        # 不建议 include: *，env/beans/threaddump 等端点会泄露敏感信息
        include: health,info,prometheus
  metrics:
    tags:
      # 给所有指标打上应用名标签，可在 Prometheus 中按 application 维度聚合查询
      application: ${spring.application.name}
