plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aiops'
version = '0.0.1-SNAPSHOT'
description = 'aiops-copilot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// 本地 Maven 缓存（可选）：通过 ~/.gradle/gradle.properties 配置 localM2=<路径> 启用，
	// 未配置或目录不存在时自动跳过，机器无关、不破坏可移植性
	def localM2Path = providers.gradleProperty('localM2').orNull
	if (localM2Path != null && file(localM2Path).exists()) {
		maven { url = file(localM2Path).toURI() }
	}
	maven { url = 'https://maven.aliyun.com/repository/public' }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Actuator：暴露 /actuator/** 监控端点（health/metrics/prometheus 等）
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Micrometer Prometheus 注册表：把 JVM/GC/HTTP 等指标转成 Prometheus 文本格式，
	// 供 /actuator/prometheus 输出。版本由 Spring Boot BOM 统一管理
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0")

	// Spring AI 2.0 Ollama Starter
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// Spring AI 2.0 Milvus Vector Store Starter
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-milvus'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 编译期暴露弃用 API 警告（主代码与测试代码），避免升级依赖后悄悄使用了将被移除的方法
tasks.named('compileJava') {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('compileTestJava') {
	options.compilerArgs += ['-Xlint:deprecation']
}

// 测试分层：test 只跑单元测试（秒级反馈，无基础设施依赖）；
// 集成测试（@Tag("integration")，需 Milvus/Ollama 在位）用 gradle integrationTest 单独触发
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = '运行 @Tag("integration") 的集成测试（需本地 Milvus/Ollama 基础设施）'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
}
