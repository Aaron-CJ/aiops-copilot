plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aiops'
version = '0.0.1-SNAPSHOT'
description = 'aiops-copilot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// 本地 Maven 缓存（可选）：仅当该目录存在时启用，其他机器/CI 自动跳过，不破坏可移植性
	def localM2 = file('D:/m2/repository')
	if (localM2.exists()) {
		maven { url = localM2.toURI() }
	}
	maven { url = 'https://maven.aliyun.com/repository/public' }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Actuator：暴露 /actuator/** 监控端点（health/metrics/prometheus 等）
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Micrometer Prometheus 注册表：把 JVM/GC/HTTP 等指标转成 Prometheus 文本格式，
	// 供 /actuator/prometheus 输出。版本由 Spring Boot BOM 统一管理
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0")

	// Spring AI 2.0 Ollama Starter
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// Spring AI 2.0 Milvus Vector Store Starter
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-milvus'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 编译期暴露弃用 API 警告（主代码与测试代码），避免升级依赖后悄悄使用了将被移除的方法
tasks.named('compileJava') {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('compileTestJava') {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('test') {
	useJUnitPlatform()
}
