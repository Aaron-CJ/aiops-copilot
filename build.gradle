plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aiops'
version = '0.0.1-SNAPSHOT'
description = 'aiops-copilot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// 本地 Maven 仓库（可选）：在 Gradle 用户目录的 gradle.properties（GRADLE_USER_HOME 下，
	// 默认 ~/.gradle；Gradle 属性读取顺序：命令行 -P > 该文件 > 项目 gradle.properties）
	// 配置 localM2=<本地仓库路径> 启用；未配置或目录不存在时自动跳过，机器无关、不破坏可移植性
	def localM2Path = providers.gradleProperty('localM2').orNull
	if (localM2Path != null && file(localM2Path).exists()) {
		maven { url = file(localM2Path).toURI() }
	}
	maven { url = 'https://maven.aliyun.com/repository/public' }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Actuator：暴露 /actuator/** 监控端点（health/metrics/prometheus 等）
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Micrometer Prometheus 注册表：把 JVM/GC/HTTP 等指标转成 Prometheus 文本格式，
	// 供 /actuator/prometheus 输出。版本由 Spring Boot BOM 统一管理
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation platform("org.springframework.ai:spring-ai-bom:2.0.2")

	// Spring AI 2.0 Ollama Starter
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// Spring AI 2.0 Milvus Vector Store Starter
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-milvus'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 编译期统一 UTF-8 编码（Windows 默认 GBK 会导致中文源码/资源乱码），并暴露弃用 API 警告
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:deprecation']
}

// JVM 崩溃日志统一指到 logs/（.gitignore 已忽略该目录内容）。
// JVM 不会自建 logs/ 目录，缺失时 -XX:ErrorFile 会退回工作目录（项目根），
// 因此 doFirst 里确保目录存在。JavaExec 覆盖 bootRun 等任务；
// Test（test/integrationTest）是独立 JVM，需单独配置。
def crashLogDir = project.rootDir.toPath().resolve('logs')
tasks.withType(JavaExec).configureEach {
	jvmArgs "-XX:ErrorFile=${crashLogDir.resolve('hs_err_pid%p.log')}"
	doFirst {
		crashLogDir.toFile().mkdirs()
	}
}
tasks.withType(Test).configureEach {
	jvmArgs "-XX:ErrorFile=${crashLogDir.resolve('hs_err_pid%p.log')}"
	doFirst {
		crashLogDir.toFile().mkdirs()
	}
}

// 测试分层：test 只跑单元测试（秒级反馈，无基础设施依赖）；
// @Tag("integration") 用 gradle integrationTest 单独触发：Spring 装配冒烟（需 Milvus 在位，
// Ollama 侧惰性连接不影响装配）与演示型基准（墙钟断言负载下偶发红，不适合秒级单测集）
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = '运行 @Tag("integration") 的集成测试（需本地 Milvus/Ollama 基础设施）'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
}

// wrapper 发行版固定：任何人/IDE 执行 `gradlew wrapper` 再生成 wrapper 文件时，镜像源、
// SHA256 校验和、超时重试都会原样写入（此前发生过 wrapper 文件被外部工具用默认官方 URL 覆盖）。
// 校验和与官方发布页一致：镜像下载内容被篡改时构建直接失败
tasks.named('wrapper', Wrapper) {
	distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-9.9.1-bin.zip'
	distributionSha256Sum = 'd8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228'
	networkTimeout = 10000
	retries = 3
	retryBackOffMs = 500
}
